name: 人工确认后自动关闭闲置 Issue

on:
  schedule:
    # 每天 UTC 凌晨 1 点执行，北京时间早上 9 点；GitHub 定时任务可能有延迟。
    - cron: "0 1 * * *"
  workflow_dispatch:

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: read

    steps:
      - name: 自动标记并关闭闲置 Issue
        uses: actions/stale@v11
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

          # 管理员人工确认时，手动添加这个标签。
          only-issue-labels: "可自动关闭"

          # 加入标签后，7 天无活动标记待关闭。
          days-before-issue-stale: 7

          # 标记待关闭后，再 7 天无活动自动关闭。
          days-before-issue-close: 7

          stale-issue-label: "待关闭"
          stale-issue-message: |
            仓库管理员已确认该 Issue 可以关闭。

            如果还有补充信息，请直接回复；回复后会重新计时。
            如果 7 天内没有新的反馈，该 Issue 将自动关闭。

          close-issue-message: |
            距离上次活动已超过 7 天，该 Issue 已自动关闭。

            如果问题仍未解决，欢迎重新打开或提交新的 Issue。

          # 任何回复都会移除“待关闭”，并重新计时。
          remove-stale-when-updated: true

          # 不处理 Pull Request。
          days-before-pr-stale: -1
          days-before-pr-close: -1

          close-issue-reason: completed
